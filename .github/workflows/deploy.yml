name: Deploy Backend

on:
  workflow_run:
    workflows: ['Test Backend']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Pull code from repository
        uses: appleboy/ssh-action@v1
        env:
          APP_ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: APP_ENV_FILE
          script: |
            cd /var/www/nestjs-boilerplate

            # Cập nhật code mới nhất từ git
            git pull origin main

             # Tạo file .env từ biến GitHub Secret (dùng dấu " " để giữ nguyên xuống dòng)
            echo "$APP_ENV_FILE" > .env
      - name: Unit test and integration test
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Di chuyển vào thư mục project trên server
            cd /var/www/nestjs-boilerplate

            pnpm run test
            pnpm run test:e2e
      - name: Run server with docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /var/www/nestjs-boilerplate

            # Build Docker Image
            docker build -t nest-app-image .

            # Dừng và xóa Container cũ (thêm || true để không báo lỗi nếu container chưa tồn tại)
            docker stop nest-app-container || true
            docker rm nest-app-container || true

            # Chạy Container mới từ Docker Image đã build
            docker run -d --name nest-app-container -p 3001:3001 nest-app-image
